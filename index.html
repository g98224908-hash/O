<script type="text/plain" id="wf">
name: Build APK
run-name: build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: job id
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare app files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, base64
          job = os.environ['JOB']
          assert re.fullmatch(r'[a-z0-9]{4,40}', job), 'bad job id'
          d = json.load(open('jobs/%s.json' % job, encoding='utf-8'))
          slug = re.sub('[^a-z]', '', str(d.get('slug', '')).lower())[:12]
          if len(slug) < 3:
              slug = 'app'
          name = ' '.join(str(d.get('name') or 'App').split())[:30]
          name = name.lstrip('@?').replace("'", '\u2019').replace('"', '\u201d').replace('\\', '') or 'App'
          name = name.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
          pkg = 'com.studio.' + slug + 'app'
          os.makedirs('w/assets', exist_ok=True)
          os.makedirs('w/res/mipmap-xxxhdpi', exist_ok=True)
          os.makedirs('w/src', exist_ok=True)
          open('w/assets/index.html', 'w', encoding='utf-8').write(d['html'])
          open('w/res/mipmap-xxxhdpi/ic_launcher.png', 'wb').write(base64.b64decode(d['icon']))
          manifest = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="__PKG__">
          <uses-permission android:name="android.permission.INTERNET"/>
          <application android:label="__LABEL__" android:icon="@mipmap/ic_launcher" android:supportsRtl="true" android:allowBackup="false" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          </application>
          </manifest>'''
          java = '''package __PKG__;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (u.startsWith("file:")) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) { }
                  return true;
                }
              });
              if (b != null) w.restoreState(b); else w.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onSaveInstanceState(Bundle o) {
              super.onSaveInstanceState(o);
              w.saveState(o);
            }
            @Override public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }'''
          open('w/AndroidManifest.xml', 'w', encoding='utf-8').write(manifest.replace('__PKG__', pkg).replace('__LABEL__', name))
          open('w/src/MainActivity.java', 'w', encoding='utf-8').write(java.replace('__PKG__', pkg))
          open(os.environ['GITHUB_ENV'], 'a').write('SLUG=%s\n' % slug)
          PY

      - name: Build and sign
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/[0-9]* | sort -V | tail -1)
          AJ=$(ls -d "$SDK"/platforms/android-[0-9]* | grep -E '/android-[0-9]+$' | sort -V | tail -1)/android.jar
          echo "build-tools: $BT"
          echo "android.jar: $AJ"
          mkdir -p keystore
          if [ ! -f keystore/release.jks ]; then
            keytool -genkeypair -keystore keystore/release.jks -alias k -keyalg RSA -keysize 2048 -validity 36500 -storepass android -keypass android -dname "CN=AI Studio"
          fi
          KS="$PWD/keystore/release.jks"
          cd w
          mkdir -p build classes out
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$AJ" --manifest AndroidManifest.xml -A assets \
            --min-sdk-version 24 --target-sdk-version 34 --version-code 1 --version-name 1.0 build/res.zip
          javac -source 8 -target 8 -Xlint:-options -cp "$AJ" -d classes src/MainActivity.java
          "$BT/d8" --release --lib "$AJ" --min-api 24 --output build $(find classes -name '*.class')
          (cd build && zip -q base.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/base.apk build/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android --out "out/$SLUG.apk" build/aligned.apk
          "$BT/apksigner" verify --verbose "out/$SLUG.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "apk-$JOB" "w/out/$SLUG.apk" --title "$SLUG" --notes "Built by AI Studio"

      - name: Save signing key and clean up
        if: always()
        run: |
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          git rm -q --ignore-unmatch "jobs/$JOB.json" || true
          git add keystore || true
          git commit -q -m "apk $JOB [skip ci]" || true
          git pull --rebase -q || true
          git push -q || true
</script>
<script>
const $=s=>document.querySelector(s);
const L=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
/* باران ماتریکس */
(function(){
  const cv=$('#rain'),cx=cv&&cv.getContext&&cv.getContext('2d');if(!cx)return;
  const G='01アイウエオカキクケコサシスセソタチツテトナニヌネ:.=*+<>',S=16;let cols=[],W=0,H=0,last=0,raf=0;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    const n=Math.ceil(W/S);cols=Array.from({length:n},(_,i)=>cols[i]!==undefined?cols[i]:(Math.random()*H/S|0));cx.fillStyle='#010a05';cx.fillRect(0,0,W,H)}
  function draw(){
    cx.fillStyle='rgba(1,10,5,.13)';cx.fillRect(0,0,W,H);cx.font=S+'px monospace';
    for(let i=0;i<cols.length;i++){const y=cols[i]*S;cx.fillStyle=Math.random()<.05?'#d8ffe9':'#00ff84';cx.fillText(G[Math.random()*G.length|0],i*S,y);cols[i]=(y>H&&Math.random()>.975)?0:cols[i]+1}}
  function step(t){raf=requestAnimationFrame(step);if(t-last<55)return;last=t;draw()}
  function still1(){for(let k=0;k<50;k++)draw()}
  size();
  if(still){still1();addEventListener('resize',()=>{size();still1()});return}
  addEventListener('resize',size);
  raf=requestAnimationFrame(step);
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(step)});
})();
/* پرامپت‌ها */
const RULES=`<output_format>
Exactly ONE complete \`\`\`html code block, then one short summary line in the user's language. Think briefly (plan in at most 8 lines), then write the code. Keep the file under about 24 KB (CSS under 200 lines, JS under 100 lines). Finish with </html>.
</output_format>
<design_thinking>
Before coding decide: purpose and audience; one bold aesthetic direction; the ONE memorable signature detail; a palette with a dominant color and one sharp accent; a display + body font pairing; the background atmosphere. Commit fully: a bold, cohesive vision beats a timid one. Match code complexity to the vision (maximalist needs richer CSS, minimal needs precision and restraint).
</design_thinking>
<aesthetics>
- Typography: a distinctive display font paired with a refined body font; strong size contrast (hero at least 3x body); never Inter, Roboto, Arial or bare system fonts.
- Color: CSS variables for every color; a dominant color with a sharp accent, not an evenly spread palette; text contrast at least 4.5:1; never a purple gradient on white.
- Backgrounds: build atmosphere and depth with layered gradients, SVG patterns or an inline SVG noise filter; never one flat color.
- Motion: CSS only; one orchestrated entrance with staggered animation-delay finished within 2s, plus clear hover, focus and active states; respect prefers-reduced-motion.
- Layout: one strong hero, a deliberate spacing rhythm, an asymmetric or grid-breaking element; avoid the template of a centered hero plus three identical cards; icons as inline SVG, not rows of emoji.
- Content: real, specific copy in the user's language; every person, brand and place INVENTED; no external images (CSS, SVG and emoji accents only).
</aesthetics>
<persian>
When the request is Persian: html lang="fa" dir="rtl"; fonts only Vazirmatn, Lalezar, Markazi Text, Noto Naskh Arabic, Noto Sans Arabic, Amiri, with a Persian font in EVERY font-family list; no letter-spacing or italics on Persian text; body line-height 1.9 and font-size at least 16px; logical CSS properties (margin-inline, padding-inline, inset-inline); Persian digits in visible numbers.
</persian>
<layout>
Design for 360px width first. *{box-sizing:border-box}; img,svg,video{max-width:100%}; no fixed widths over 100%; flex-wrap, min-width:0, overflow-wrap:anywhere; no overlapping text; no overflow-x:hidden hacks; touch targets at least 44px; inputs font-size at least 16px; fixed bars must not cover content (pad the body); full-height areas use min-height:100vh then min-height:100dvh; content visible without JavaScript.
</layout>
<code_quality>
Starts with <!DOCTYPE html>, ends with </html>. Include a <title>. Only external resource is ONE Google Fonts link. Unique ids; every href is an existing #id (never "#"); buttons are type="button". Semantic landmarks (header, main, nav, footer) and visible :focus-visible styles. Plain ES2017 in ONE script tag at the end of body, ASCII quotes, no alert/confirm/prompt, no inline on* attributes (use addEventListener), null-check elements, localStorage only inside try/catch. Every control you render must work. No TODO, no lorem ipsum, no unrequested features.

    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const payload=JSON.stringify({name:nm,slug:mt.slug,html:h,icon:$('#ic').toDataURL('image/png').split(',')[1]});
    am('۱/۴ دارم فایل‌ها رو می‌فرستم...');
    await ghj('/repos/'+repo+'/contents/jobs/'+id+'.json',{method:'PUT',body:{message:'job '+id,content:b64u(payload)}});
    const info=(await ghj('/repos/'+repo)).j;
    am('۲/۴ دارم ربات رو روشن می‌کنم...');
    const d=await gh('/repos/'+repo+'/actions/workflows/build-apk.yml/dispatches',{method:'POST',body:{ref:info.default_branch,inputs:{job:id}}});
    if(d.status!==204){let m='';try{m=(await d.json()).message}catch(e){}throw new Error('شروع ساخت نشد: '+(m||d.status)+' (اول «راه‌اندازی خودکار» رو بزن.)')}
    const t0=Date.now();
    for(;;){
      await wait(6000);
      const sec=Math.round((Date.now()-t0)/1000);
      if(sec>900)throw new Error('بیشتر از ۱۵ دقیقه طول کشید؛ تب Actions ریپو رو چک کن.');
      const rl=await ghj('/repos/'+repo+'/releases/tags/apk-'+id,{soft:true});
      if(rl.ok&&rl.j&&rl.j.assets&&rl.j.assets.length){showApk(repo,rl.j);return}
      const rs=await ghj('/repos/'+repo+'/actions/runs?event=workflow_dispatch&per_page=10',{soft:true});
      const run=rs.ok&&rs.j&&(rs.j.workflow_runs||[]).find(x=>x.display_title==='build '+id);
      if(run&&run.status==='completed'&&run.conclusion!=='success')throw new Error('ساخت ناموفق بود ('+run.conclusion+'). لاگ: '+run.html_url);
      am((run&&run.status==='in_progress'?'۳/۴ ربات داره اپ رو می‌سازه...':'۳/۴ منتظر شروع ربات...')+' ('+sec+' ثانیه)');
    }
  }catch(e){am('خطا: '+(e.name==='TypeError'?'اتصال به گیت‌هاب برقرار نشد (اینترنت یا VPN).':e.message),'var(--r)')}
  finally{b.disabled=false}
}
$('#apkbuild').onclick=buildApk;
$('#apkdl').onclick=async()=>{
  if(!apkAsset)return;const b=$('#apkdl');b.disabled=true;am('دارم دانلود می‌کنم...');
  try{
    const r=await gh('/repos/'+apkAsset.repo+'/releases/assets/'+apkAsset.a.id,{headers:{Accept:'application/octet-stream'}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const bl=await r.blob();
    const u=URL.createObjectURL(new Blob([bl],{type:'application/vnd.android.package-archive'}));
    const x=document.createElement('a');x.href=u;x.download=apkAsset.a.name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
    am('✅ دانلود شد. فایل رو از پوشه‌ی Downloads باز کن و نصب کن.','var(--c)');
  }catch(e){am('دانلود مستقیم نشد؛ از «صفحه‌ی APK در گیت‌هاب» دانلودش کن. ('+e.message+')','var(--r)')}
  finally{b.disabled=false}
};
/* ناوبری */
function go(n){
  [1,2,3].forEach(i=>{$('#v'+i).hidden=i!==n;document.querySelector('nav [data-v="'+i+'"]').setAttribute('aria-pressed',String(i===n))});
  if(n<3)mode=n===2?'a':'s';
  document.body.style.setProperty('--c',n===2?'#2de2ff':'#00ff84');
  scrollTo({top:0});
}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>go(Number(b.dataset.v)));
</script>
