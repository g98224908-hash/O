<style>
:root{--bg:#010a05;--p:rgba(2,22,12,.74);--c:#00ff84;--l:rgba(0,255,132,.24);--f:#e4fff0;--m:#86c2a2;--r:#ff4d6d;color-scheme:dark;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}

html{background:var(--bg)}
body{margin:0;color:var(--f);font:400 16px/1.8 Vazirmatn,system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(80% 60% at 50% 35%,rgba(1,10,5,.9),rgba(1,10,5,.4) 75%),repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}

#bal{flex:none;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis;direction:rtl}
.hero{border:1px solid var(--l);border-radius:20px;padding:16px;margin:0 0 12px;background:linear-gradient(120deg,rgba(0,255,132,.14),rgba(2,22,12,.88) 60%);box-shadow:0 0 40px -14px var(--c),inset 0 0 40px rgba(0,255,132,.07)}

h1 b{display:block;color:var(--c);text-shadow:0 0 18px var(--c);animation:gl 6s steps(1) infinite}
@keyframes gl{0%,93%,100%{transform:none}94%{transform:translateX(3px);text-shadow:-3px 0 #ff4d6d,3px 0 #00d4ff}96%{transform:translateX(-3px)}}
.sub{margin:0;color:var(--m);font-size:14px;overflow-wrap:anywhere}
.g{position:relative;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin:12px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 34px -18px var(--c),inset 0 0 24px rgba(0,255,132,.04)}
.g::before{content:"";position:absolute;inset-inline-start:12px;top:-1px;width:34px;height:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
label,.t{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
.t{font-weight:700;color:var(--f);font-size:15px;margin-top:0}
input,select,textarea{width:100%;min-height:44px;background:rgba(0,10,5,.75);color:var(--f);border:1px solid var(--l);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;font-size:15px;min-height:44px;cursor:pointer;border:1px solid var(--l);background:rgba(0,255,132,.07);color:var(--f);border-radius:10px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
button[aria-pressed=true]{background:rgba(0,255,132,.22);color:var(--c);border-color:var(--c)}
button:disabled{opacity:.45;cursor:wait}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.go{width:100%;margin-top:12px;font-weight:900;font-size:18px;color:#00180b;border:0;background:linear-gradient(100deg,var(--c),#7dffc0);box-shadow:0 0 30px -6px var(--c)}
.chips,.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.chips button{border-radius:999px;font-size:13px;min-height:38px;padding:4px 14px}
.row>input{flex:1;min-width:150px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{min-height:36px;font-size:13px;padding:2px 12px;border-radius:999px;color:var(--c)}
.log{font:12.5px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--c);background:rgba(0,8,3,.88);border:1px solid var(--l);border-radius:12px;padding:12px;margin:12px 0;max-height:190px;overflow:auto}
.log:empty{display:none}.log .e{color:var(--r)}
.stage{display:flex;justify-content:center;background:rgba(0,8,3,.7);border:1px solid var(--l);border-radius:14px;padding:10px;overflow:auto}
iframe{width:100%;height:66vh;min-height:420px;border:0;border-radius:8px;background:#fff;display:block}
.code{direction:ltr;text-align:left;font:12.5px var(--mono);min-height:380px}

/* بخش اپ: ظاهر و ساختار مستقل */
.app{--c:#2de2ff;--l:rgba(45,226,255,.26);--p:rgba(2,14,26,.78);--m:#8fc4d4}
.app .hero{background:linear-gradient(160deg,rgba(45,226,255,.16),rgba(2,14,26,.9) 65%);box-shadow:0 0 40px -14px var(--c);display:flex;gap:12px;align-items:center}

.steps{display:flex;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:12px;padding:6px 2px;border:1px dashed var(--l);border-radius:10px;color:var(--m)}
.phone{width:min(100%,300px);margin:0 auto;padding:12px 8px;border:2px solid var(--c);border-radius:38px;background:#02080f;box-shadow:0 0 40px -10px var(--c)}

nav{position:fixed;inset-inline:0;bottom:0;z-index:5;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px))}

@keyframes pl{50%{transform:scale(.7);opacity:.6}}
a.lnk,a.go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--l);border-radius:10px;padding:6px 14px;color:var(--c);text-decoration:none;font-size:15px}
a.go{display:flex;width:100%}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){h1 b,#stop i{animation:none}}
</style>

<script type="text/plain" id="wf">
name: Build APK
# studio-wf: alarm-3
run-name: build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: job id
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare app files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, base64
          job = os.environ['JOB']
          assert re.fullmatch(r'[a-z0-9]{4,40}', job), 'bad job id'
          d = json.load(open('jobs/%s.json' % job, encoding='utf-8'))
          slug = re.sub('[^a-z]', '', str(d.get('slug', '')).lower())[:12]
          if len(slug) < 3:
              slug = 'app'
          name = ' '.join(str(d.get('name') or 'App').split())[:30]
          name = name.lstrip('@?').replace("'", '\u2019').replace('"', '\u201d').replace('\\', '') or 'App'
          name = name.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
          pkg = 'com.studio.' + slug + 'app'
          os.makedirs('w/assets', exist_ok=True)
          os.makedirs('w/res/mipmap-xxxhdpi', exist_ok=True)
          os.makedirs('w/src', exist_ok=True)
          open('w/assets/index.html', 'w', encoding='utf-8').write(d['html'])
          open('w/res/mipmap-xxxhdpi/ic_launcher.png', 'wb').write(base64.b64decode(d['icon']))
          manifest = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="__PKG__">
          <uses-permission android:name="android.permission.INTERNET"/>
          __PERMS__
          <application android:label="__LABEL__" android:icon="@mipmap/ic_launcher" android:supportsRtl="true" android:allowBackup="false" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode" android:windowSoftInputMode="adjustResize">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          __RECV__
          </application>
          </manifest>'''
          j_MainActivity = '''package __PKG__;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            private void lockFlags(Intent in) {
              if (Build.VERSION.SDK_INT >= 27 && in != null && in.getBooleanExtra("fromAlarm", false)) {
                setShowWhenLocked(true);
                setTurnScreenOn(true);
              }
            }
            @Override protected void onNewIntent(Intent in) {
              super.onNewIntent(in);
              setIntent(in);
              lockFlags(in);
              if (w != null && in != null && in.getBooleanExtra("fromAlarm", false)) {
                w.evaluateJavascript("window.dispatchEvent(new Event('alarmopened'))", null);
              }
            }
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              lockFlags(getIntent());
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.addJavascriptInterface(new Bridge(this), "AndroidAlarm");
              w.setWebChromeClient(new WebChromeClient());
              w.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  String u = r.getUrl().toString();
                  if (u.startsWith("file:")) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception e) { }
                  return true;
                }
              });
              if (b != null) w.restoreState(b); else w.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onSaveInstanceState(Bundle o) {
              super.onSaveInstanceState(o);
              w.saveState(o);
            }
            @Override public void onBackPressed() {
              if (w.canGoBack()) w.goBack(); else super.onBackPressed();
            }
          }'''
          j_Bridge = '''package __PKG__;
          import android.app.Activity;
          import android.content.Intent;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.webkit.JavascriptInterface;
          public class Bridge {
            private final Activity a;
            Bridge(Activity a) { this.a = a; }
            private boolean notifOk() {
              if (Build.VERSION.SDK_INT < 33) return true;
              return a.checkSelfPermission("android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED;
            }
            @JavascriptInterface public boolean permission() { return notifOk(); }
            @JavascriptInterface public void requestPermission() {
              if (notifOk()) return;
              a.runOnUiThread(new Runnable() {
                @Override public void run() {
                  a.requestPermissions(new String[] {"android.permission.POST_NOTIFICATIONS"}, 77);
                }
              });
            }
            @JavascriptInterface public boolean schedule(double id, double timeMs, double repeatMs, String title, String body) {
              try {
                requestPermission();
                return AlarmUtil.schedule(a.getApplicationContext(), (int) id, (long) timeMs, (long) repeatMs, title, body);
              } catch (Exception e) {
                return false;
              }
            }
            @JavascriptInterface public boolean fromAlarm() {
              Intent in = a.getIntent();
              return in != null && in.getBooleanExtra("fromAlarm", false);
            }
            @JavascriptInterface public void stop() {
              try {
                NotificationManager nm = (NotificationManager) a.getSystemService(Context.NOTIFICATION_SERVICE);
                nm.cancelAll();
              } catch (Exception e) { }
            }
            @JavascriptInterface public void cancel(double id) {
              try { AlarmUtil.cancel(a.getApplicationContext(), (int) id); } catch (Exception e) { }
            }
            @JavascriptInterface public void batterySettings() {
              a.runOnUiThread(new Runnable() {
                @Override public void run() {
                  try {
                    Intent i = new Intent("android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS");
                    a.startActivity(i);
                  } catch (Exception e) { }
                }
              });
            }
          }'''
          j_AlarmUtil = '''package __PKG__;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.HashSet;
          import java.util.Set;
          public class AlarmUtil {
            static final String PREFS = "alarms";
            static PendingIntent firePi(Context c, int id, String ti, String b) {
              Intent i = new Intent(c, AlarmReceiver.class);
              i.setAction("alarm." + id);
              i.putExtra("id", id);
              i.putExtra("title", ti);
              i.putExtra("body", b);
              return PendingIntent.getBroadcast(c, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }
            static void arm(Context c, int id, long t, String ti, String b) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              Intent open = new Intent(c, MainActivity.class);
              PendingIntent show = PendingIntent.getActivity(c, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              am.setAlarmClock(new AlarmManager.AlarmClockInfo(t, show), firePi(c, id, ti, b));
            }
            static void save(Context c, int id, long t, long r, String ti, String b) {
              SharedPreferences sp = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              Set<String> ids = new HashSet<String>(sp.getStringSet("ids", new HashSet<String>()));
              ids.add(String.valueOf(id));
              sp.edit().putStringSet("ids", ids).putLong(id + "_t", t).putLong(id + "_r", r).putString(id + "_ti", ti).putString(id + "_b", b).apply();
            }
            static void forget(Context c, int id) {
              SharedPreferences sp = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              Set<String> ids = new HashSet<String>(sp.getStringSet("ids", new HashSet<String>()));
              ids.remove(String.valueOf(id));
              sp.edit().putStringSet("ids", ids).remove(id + "_t").remove(id + "_r").remove(id + "_ti").remove(id + "_b").apply();
            }
            static long next(long t, long r, long now) {
              if (t > now) return t;
              if (r <= 0) return -1;
              return t + ((now - t) / r + 1) * r;
            }
            static boolean schedule(Context c, int id, long t, long r, String ti, String b) {
              if (ti == null) ti = "";
              if (b == null) b = "";
              long n = next(t, r, System.currentTimeMillis());
              if (n < 0) return false;
              save(c, id, n, r, ti, b);
              arm(c, id, n, ti, b);
              return true;
            }
            static void cancel(Context c, int id) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              am.cancel(firePi(c, id, "", ""));
              forget(c, id);
            }
            static void afterFire(Context c, int id) {
              SharedPreferences sp = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              long t = sp.getLong(id + "_t", 0);
              long r = sp.getLong(id + "_r", 0);
              String ti = sp.getString(id + "_ti", "");
              String b = sp.getString(id + "_b", "");
              if (r > 0) {
                long n = next(t, r, System.currentTimeMillis() + 1000);
                save(c, id, n, r, ti, b);
                arm(c, id, n, ti, b);
              } else {
                forget(c, id);
              }
            }
            static void restoreAll(Context c) {
              SharedPreferences sp = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              Set<String> ids = new HashSet<String>(sp.getStringSet("ids", new HashSet<String>()));
              long now = System.currentTimeMillis();
              for (String s : ids) {
                int id;
                try { id = Integer.parseInt(s); } catch (Exception e) { continue; }
                long t = sp.getLong(id + "_t", 0);
