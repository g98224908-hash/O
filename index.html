<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استودیو ساخت سایت و اپ با هوش مصنوعی</title>
<meta name="theme-color" content="#010a05">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23010a05'/%3E%3Cpath d='M16 4l10 6v12l-10 6-10-6V10z' fill='none' stroke='%2300ff84' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Space+Grotesk:wght@700&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#010a05;--p:rgba(2,22,12,.74);--c:#00ff84;--l:rgba(0,255,132,.24);--f:#e4fff0;--m:#86c2a2;--r:#ff4d6d;color-scheme:dark;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--f);font:400 16px/1.8 Vazirmatn,system-ui,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(80% 60% at 50% 35%,rgba(1,10,5,.9),rgba(1,10,5,.4) 75%),repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(110px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;padding:4px 2px 12px}
.logo{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 8px rgba(0,255,132,.8))}
.brand{flex:1;min-width:0;line-height:1.4}
.brand b{display:block;font:700 21px "Space Grotesk",Vazirmatn,sans-serif;color:var(--c);text-shadow:0 0 12px var(--c)}
.brand span{font-size:13px;color:var(--m)}
.hero{border:1px solid var(--l);border-radius:20px;padding:16px;margin:0 0 12px;background:linear-gradient(120deg,rgba(0,255,132,.14),rgba(2,22,12,.88) 60%);box-shadow:0 0 40px -14px var(--c),inset 0 0 40px rgba(0,255,132,.07)}
h1{font-size:clamp(26px,8vw,40px);line-height:1.4;margin:0 0 6px;font-weight:900}
h1 b{display:block;color:var(--c);text-shadow:0 0 18px var(--c);animation:gl 6s steps(1) infinite}
@keyframes gl{0%,93%,100%{transform:none}94%{transform:translateX(3px);text-shadow:-3px 0 #ff4d6d,3px 0 #00d4ff}96%{transform:translateX(-3px)}}
.sub{margin:0;color:var(--m);font-size:14px;overflow-wrap:anywhere}
.g{position:relative;background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px;margin:12px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 34px -18px var(--c),inset 0 0 24px rgba(0,255,132,.04)}
.g::before{content:"";position:absolute;inset-inline-start:12px;top:-1px;width:34px;height:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
label,.t{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
.t{font-weight:700;color:var(--f);font-size:15px;margin-top:0}
input,select,textarea{width:100%;min-height:44px;background:rgba(0,10,5,.75);color:var(--f);border:1px solid var(--l);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;font-size:15px;min-height:44px;cursor:pointer;border:1px solid var(--l);background:rgba(0,255,132,.07);color:var(--f);border-radius:10px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 14px -4px var(--c)}
button[aria-pressed=true]{background:rgba(0,255,132,.22);color:var(--c);border-color:var(--c)}
button:disabled{opacity:.45;cursor:wait}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.go{width:100%;margin-top:12px;font-weight:900;font-size:18px;color:#00180b;border:0;background:linear-gradient(100deg,var(--c),#7dffc0);box-shadow:0 0 30px -6px var(--c)}
.chips,.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.chips button{border-radius:999px;font-size:13px;min-height:38px;padding:4px 14px}
.row>input{flex:1;min-width:150px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{min-height:36px;font-size:13px;padding:2px 12px;border-radius:999px;color:var(--c)}
.log{font:12.5px/1.7 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--c);background:rgba(0,8,3,.88);border:1px solid var(--l);border-radius:12px;padding:12px;margin:12px 0;max-height:190px;overflow:auto}
.log:empty{display:none}.log .e{color:var(--r)}
.stage{display:flex;justify-content:center;background:rgba(0,8,3,.7);border:1px solid var(--l);border-radius:14px;padding:10px;overflow:auto}
iframe{width:100%;height:66vh;min-height:420px;border:0;border-radius:8px;background:#fff;display:block}
.code{direction:ltr;text-align:left;font:12.5px var(--mono);min-height:380px}
.eb{color:var(--r);font-size:14px;overflow-wrap:anywhere}
.ms{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--m)}
/* بخش اپ: ظاهر و ساختار مستقل */
.app{--c:#2de2ff;--l:rgba(45,226,255,.26);--p:rgba(2,14,26,.78);--m:#8fc4d4}
.app .hero{background:linear-gradient(160deg,rgba(45,226,255,.16),rgba(2,14,26,.9) 65%);box-shadow:0 0 40px -14px var(--c);display:flex;gap:12px;align-items:center}
.app .go{background:linear-gradient(100deg,#2de2ff,#a78bfa)}
.steps{display:flex;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:12px;padding:6px 2px;border:1px dashed var(--l);border-radius:10px;color:var(--m)}
.phone{width:min(100%,300px);margin:0 auto;padding:12px 8px;border:2px solid var(--c);border-radius:38px;background:#02080f;box-shadow:0 0 40px -10px var(--c)}
.phone iframe{height:min(60vh,520px);min-height:380px;border-radius:24px}
nav{position:fixed;inset-inline:0;bottom:0;z-index:5;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--l);border-radius:18px;background:rgba(1,12,6,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 30px -8px var(--c)}
nav button{border:0;background:none;min-height:54px;font-size:12px;padding:6px 2px;color:var(--m)}
nav button[aria-pressed=true]{color:var(--c);text-shadow:0 0 8px var(--c)}
nav svg{width:22px;height:22px;display:block;margin:0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stop{position:fixed;inset-inline:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;max-width:532px;margin:0 auto;background:var(--r);color:#fff;border:0;font-weight:700}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){h1 b{animation:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
<header>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="rgba(0,255,132,.1)" stroke="#00ff84" stroke-width="2"/><path d="M24 14l9 16H15z" fill="none" stroke="#00ff84" stroke-width="2"/><circle cx="24" cy="25" r="2.5" fill="#00ff84"/></svg>
  <div class="brand"><b lang="en">AI STUDIO</b><span>ساخت سایت و اپ اندروید با هوش مصنوعی</span></div>
</header>
<section id="v1"></section>
<section id="v2" class="app" hidden></section>
<section id="v3" hidden>
  <div class="g">
    <label class="t" for="key">API key</label>
    <input id="key" type="password" autocomplete="off" dir="ltr" placeholder="dahl_...">
    <label for="base">Base URL</label>
    <input id="base" dir="ltr" value="https://inference.dahl.global/v1">
    <label for="model">مدل</label>
    <div class="row"><select id="model" dir="ltr" style="flex:1"><option>MiniMaxAI/MiniMax-M2.7</option></select><button id="rf" type="button">بروزرسانی</button></div>
    <p id="ms" class="ms" role="status" aria-live="polite"></p>
  </div>
</section>
</main>
<button id="stop" type="button" hidden>⏹ توقف</button>
<nav aria-label="منوی اصلی"><div>
  <button data-v="1" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>سایت</button>
  <button data-v="2" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>اپ اندروید</button>
  <button data-v="3" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>تنظیمات</button>
</div></nav>
<script>
const $=s=>document.querySelector(s);
const L=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
/* باران ماتریکس */
(function(){
  const cv=$('#rain'),cx=cv&&cv.getContext&&cv.getContext('2d');if(!cx)return;
  const G='01アイウエオカキクケコサシスセソタチツテトナニヌネ:.=*+<>',S=16;let cols=[],W=0,H=0,last=0,raf=0;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    const n=Math.ceil(W/S);cols=Array.from({length:n},(_,i)=>cols[i]!==undefined?cols[i]:(Math.random()*H/S|0));cx.fillStyle='#010a05';cx.fillRect(0,0,W,H)}
  function step(t){raf=requestAnimationFrame(step);if(t-last<55)return;last=t;
    cx.fillStyle='rgba(1,10,5,.13)';cx.fillRect(0,0,W,H);cx.font=S+'px monospace';
    for(let i=0;i<cols.length;i++){const y=cols[i]*S;cx.fillStyle=Math.random()<.05?'#d8ffe9':'#00ff84';cx.fillText(G[Math.random()*G.length|0],i*S,y);cols[i]=(y>H&&Math.random()>.975)?0:cols[i]+1}}
  size();addEventListener('resize',size);
  if(still){for(let k=0;k<50;k++)step(k*100);cancelAnimationFrame(raf);return}
  raf=requestAnimationFrame(step);
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden)raf=requestAnimationFrame(step)});
})();
/* پرامپت‌ها */
const RULES=`OUTPUT: exactly ONE complete \`\`\`html code block, then one short summary line in the user's language. Think briefly, then write. Keep the file under about 24 KB (CSS under 200 lines, JS under 100 lines). Finish with </html>.
DESIGN: commit to a distinctive aesthetic (not Inter/Roboto/Arial, not purple-on-white). CSS variables, layered gradients, inline SVG, glow, glass panels. One strong hero, CSS/SVG/emoji only, no external images. CSS-only motion finished within 2s, respect prefers-reduced-motion. Real specific copy in the user's language; every person, brand and place INVENTED.
PERSIAN (when request is Persian): html lang="fa" dir="rtl"; fonts only Vazirmatn, Lalezar, Markazi Text, Noto Naskh Arabic, Noto Sans Arabic, Amiri; a Persian font in EVERY font-family list; no letter-spacing or italics on Persian text; body line-height 1.9, font-size at least 16px; logical CSS properties.
LAYOUT (360px width): *{box-sizing:border-box}; img,svg,video{max-width:100%}; no fixed widths over 100%; flex-wrap, min-width:0, overflow-wrap:anywhere; no overlapping text; no overflow-x:hidden hacks; touch targets at least 44px; fixed bars must not cover content; content visible without JavaScript.
CODE: starts with <!DOCTYPE html>, ends with </html>. Only external resource is one Google Fonts link. Unique ids; every href is an existing #id (never "#"); buttons are type="button". Plain ES2017 in ONE script tag at the end of body, ASCII quotes, no alert/confirm/prompt, null-check elements, localStorage in try/catch. No TODO, no lorem ipsum. Do not add unrequested features.`;
const SYS_S='You are a senior front-end engineer and designer. Turn a short request into ONE finished, memorable, bug-free website (single index.html, inline CSS and JS).\n'+RULES;
const SYS_A='You are a senior mobile app designer-engineer. Turn a short request into ONE finished Android-style app UI as a single index.html that behaves like a native app when added to the home screen: full-height app shell (100dvh), top app bar, bottom tab bar with 2-4 screens switched by JavaScript, working interactions (lists, forms, counters, timers or whatever the request needs) with state kept in memory and optional localStorage, Material-like touch feedback, safe-area padding (env(safe-area-inset-*)), viewport-fit=cover, theme-color meta. Mobile only, no desktop layout. WEBVIEW: the file is packaged into an Android WebView app loaded from file:///android_asset/index.html and must work offline: relative paths only, no service worker, no ES modules, no fetch of local files, no file download, print or camera features, data only in localStorage (try/catch), opaque backgrounds, system-font fallbacks. Screens must be visible without a click for the first tab.\n'+RULES;
const BRIEF='You are an art director. Given a request and an aesthetic direction, reply with a SHORT design brief (max 110 words, same language as the request): audience, direction, 4 named hex colors, display + body font (Persian: only Vazirmatn, Lalezar, Markazi Text, Noto Naskh Arabic or Amiri), hero idea, sections or screens, one signature motion. Invent all names. No code.';
const ENH='You rewrite a short website or app request into a richer, specific, buildable request (max 90 words, same language, no markdown, no code): subject, audience, key sections or screens, features, mood. Do not add real brands or people. Reply with the rewritten request only.';
const DIRS=[['auto','خودکار'],['neon cyber-noir with glowing neon accents and glass panels','سایبر نئون'],['editorial magazine: huge type, tight grid, rules','مجله‌ای'],['neo-brutalist: thick borders, flat bold colors, hard shadows','برالیست'],['retro-futuristic: CRT glow, mono type, scanlines','رترو فیوچر'],['luxury minimal: whitespace, refined type, one metallic accent','مینیمال لوکس'],['playful gaming: bold shapes, vivid gradients','گیمینگ']];
const EX={s:[['ویدیو','یه سایت برای ویدیو بساز: گالری ویدیو، پلیر خفن و لیست پخش'],['فیلم','یه صفحه معرفی برای یه فیلم خیالی با طراحی سینمایی بساز'],['شخصی','یه سایت شخصی برای یه برنامه‌نویس با پروژه‌ها و تماس بساز']],
 a:[['یادداشت','یه اپ یادداشت‌برداری با دسته‌بندی و جستجو'],['تایمر','یه اپ تایمر تمرکز (پومودورو) با آمار روزانه'],['خرج‌ها','یه اپ ثبت خرج روزانه با نمودار ساده']]};
const PRO=[{re:/minimax/i,t:1,p:.95,k:40,split:true},{re:/kimi|glm/i,t:1,p:.95},{re:/deepseek/i,t:1,p:1}];
const sel=$('#model'),prof=()=>PRO.find(x=>x.re.test(sel.value))||{t:1,p:.95};
const S={s:{html:'',vers:[],errs:[]},a:{html:'',vers:[],errs:[]}};
let running=false,stopped=false,curAc=null,dir=DIRS[0][0],lastCut=false,mode='s';
const base=()=>$('#base').value.trim().replace(/\/+$/,'');
/* ساخت دو بخش مستقل */
const APKBOX=`<div class="g" id="apkbox" hidden><span class="t">ساخت APK</span>
  <div class="row"><canvas id="ic" width="192" height="192" style="width:76px;height:76px;border-radius:18px" aria-label="آیکون"></canvas><div style="flex:1;min-width:150px"><label for="apn" style="margin:0 0 4px">اسم اپ</label><input id="apn" maxlength="30"></div></div>
  <div class="row"><button id="aps" class="go" type="button" style="margin:0">۱ دانلود build-apk.sh</button></div>
  <div class="row"><button id="apt" type="button">۲ کپی دستور ترموکس</button><button id="api" type="button">دانلود آیکون</button><button id="apr" type="button">آیکون جدید</button></div>
  <p class="ms" id="apm"></p></div>`;
function panel(m){
  const a=m==='a';
  return `<div class="hero"><div><h1>${a?'اپ اندروید':'هر سایتی که بخوای،'}<b>${a?'با یک جمله.':'با یک جمله.'}</b></h1><p class="sub">${a?'اپ موبایلی با نوار پایین و چند صفحه می‌سازه؛ در کروم «افزودن به صفحه اصلی» رو بزن تا مثل اپ نصب بشه.':'بنویس چی می‌خوای. اول طرح می‌کشه، بعد کد می‌نویسه و خودش چکش می‌کنه.'}</p></div></div>
  ${a?'<ol class="steps"><li>۱ توضیح</li><li>۲ ساخت</li><li>۳ پیش‌نمایش</li><li>۴ نصب</li></ol>':''}
  <div class="g">
    ${a?'':'<span class="t">حال‌وهوای طراحی</span><div class="chips" id="dirs"></div>'}
    <div class="top"><label class="t" for="q${m}" style="margin:0">${a?'چه اپی می‌خوای؟':'چه سایتی می‌خوای؟'}</label><button class="mini" id="en${m}" type="button">✨ بهتر کن</button></div>
    <textarea id="q${m}" placeholder="${a?'مثلاً: اپ یادداشت با دسته‌بندی رنگی':'مثلاً: سایتی برای یک کافه با منو و رزرو'}"></textarea>
    <div class="chips" id="ex${m}"></div>
    <button class="go" id="go${m}" type="button">بساز</button>
  </div>
  <div class="log" id="lg${m}" role="status" aria-live="polite"></div>
  <div class="row"><button id="t1${m}" type="button" aria-pressed="true">پیش‌نمایش</button><button id="t2${m}" type="button" aria-pressed="false">کد</button>
  ${a?'':'<button id="d1" type="button" aria-pressed="false">موبایل</button><button id="d3" type="button" aria-pressed="true">دسکتاپ</button>'}<button id="fs${m}" type="button">تمام‌صفحه</button></div>
  <div id="pv${m}"><div class="stage"><div id="fw${m}" style="width:100%"><div class="${a?'phone':''}"><iframe id="fr${m}" sandbox="allow-scripts allow-forms allow-modals" title="پیش‌نمایش" srcdoc="<body style='margin:0;display:grid;place-items:center;height:100vh;background:#010a05;color:#00ff84;font:16px Tahoma,sans-serif' dir='rtl'>هنوز چیزی ساخته نشده</body>"></iframe></div></div></div>
  <div class="g eb" id="eb${m}" hidden><div id="et${m}"></div><button id="fix${m}" type="button" style="margin-top:8px">رفع خطا با هوش مصنوعی</button></div></div>
  <div id="cv${m}" hidden><textarea class="code" id="cd${m}" readonly aria-label="کد"></textarea>
  <div class="row"><button id="cp${m}" type="button">کپی کد</button><button id="dl${m}" type="button">دانلود ${a?'app.html':'index.html'}</button></div></div>
  ${a?APKBOX:''}
  <div class="g"><label class="t" for="ch${m}">تغییر بده</label>
  <div class="row"><input id="ch${m}" placeholder="مثلاً: رنگ‌ها گرم‌تر بشه"><button id="ap${m}" type="button">اعمال</button></div>
  <div class="row"><button id="up${m}" type="button">ارتقای طراحی</button><button id="un${m}" type="button">نسخه قبلی</button></div></div>`;
}
$('#v1').innerHTML=panel('s');$('#v2').innerHTML=panel('a');
$('#key').value=L('key')||'';if(L('base'))$('#base').value=L('base');
['key','base'].forEach(k=>['change','input'].forEach(ev=>$('#'+k).addEventListener(ev,()=>L(k,$('#'+k).value))));
sel.addEventListener('change',()=>L('model',sel.value));
const log=(m,t,bad,clr)=>{const e=$('#lg'+m);if(clr)e.textContent='';if(!t)return;const d=document.createElement('div');if(bad)d.className='e';d.textContent=t;e.appendChild(d);e.scrollTop=e.scrollHeight};
const IDS=['gos','goa','fixs','fixa','aps','apa','ups','upa','uns','una','ens','ena','rf'];
const busy=b=>{IDS.forEach(i=>{const e=$('#'+i);if(e)e.disabled=b});$('#stop').hidden=!b};
DIRS.forEach(([v,n],i)=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed',String(i===0));
  b.onclick=()=>{dir=v;$('#dirs').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};$('#dirs').appendChild(b)});
['s','a'].forEach(m=>EX[m].forEach(([n,t])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>{$('#q'+m).value=t};$('#ex'+m).appendChild(b)}));
/* مدل‌ها */
const ms=(t,c)=>{const e=$('#ms');e.textContent=t;e.style.color=c||''};
async function models(){
  const b=$('#rf');b.disabled=true;ms('دارم وصل می‌شم...');
  try{
    const r=await fetch(base()+'/models');if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();if(!j||!Array.isArray(j.data)||!j.data.length)throw new Error('لیست مدل خالی بود');
    const keep=L('model')||sel.value;sel.innerHTML='';j.data.forEach(x=>sel.add(new Option(x.id,x.id)));
    const d=[...sel.options].find(o=>/MiniMax-M2\.7$/.test(o.value));
    if(keep&&[...sel.options].some(o=>o.value===keep))sel.value=keep;else if(d)sel.value=d.value;

  x.fillStyle=g;x.beginPath();if(x.roundRect)x.roundRect(0,0,192,192,44);else x.rect(0,0,192,192);x.fill();
  x.font='104px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(mt.emoji,96,106);
}
function mkScript(){
  const mt=S.a.meta,h=S.a.html;if(!mt||!h)return '';
  const nm=($('#apn').value.trim()||mt.name).slice(0,30),pkg='com.studio.'+mt.slug,E='APKSTUDIO_EOF';
  const png=$('#ic').toDataURL('image/png').split(',')[1];
  const man='<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="'+pkg+'" android:versionCode="1" android:versionName="1.0">\n<uses-sdk android:minSdkVersion="24" android:targetSdkVersion="28"/>\n<uses-permission android:name="android.permission.INTERNET"/>\n<application android:label="'+xe(nm)+'" android:icon="@mipmap/ic_launcher" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n<activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">\n<intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>\n</activity>\n</application>\n</manifest>';
  const jv='package '+pkg+';\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.webkit.WebChromeClient;\npublic class MainActivity extends Activity {\n  private WebView w;\n  @Override protected void onCreate(Bundle b) {\n    super.onCreate(b);\n    w = new WebView(this);\n    setContentView(w);\n    WebSettings s = w.getSettings();\n    s.setJavaScriptEnabled(true);\n    s.setDomStorageEnabled(true);\n    w.setWebViewClient(new WebViewClient());\n    w.setWebChromeClient(new WebChromeClient());\n    w.loadUrl("file:///android_asset/index.html");\n  }\n  @Override public void onBackPressed() {\n    if (w.canGoBack()) w.goBack(); else super.onBackPressed();\n  }\n}';
  return [
    '#!/data/data/com.termux/files/usr/bin/bash','set -e',
    'trap \'echo "FAILED: run  pkg update && pkg upgrade -y  then run this script again"\' ERR',
    'echo "[1/6] installing tools (first run takes a few minutes)"',
    'pkg install -y aapt aapt2 ecj dx apksigner zip openjdk-17 >/dev/null',
    'AJ="$PREFIX/share/aapt/android.jar"',
    '[ -f "$AJ" ] || { echo "android.jar not found: $AJ"; exit 1; }',
    'W="$HOME/apkstudio-'+mt.slug+'"',
    'rm -rf "$W"; mkdir -p "$W/src" "$W/res/mipmap-xxxhdpi" "$W/assets" "$W/build/classes"','cd "$W"',
    "cat > assets/index.html <<'"+E+"'",h,E,
    "base64 -d > res/mipmap-xxxhdpi/ic_launcher.png <<'"+E+"'",png,E,
    "cat > AndroidManifest.xml <<'"+E+"'",man,E,
    "cat > src/MainActivity.java <<'"+E+"'",jv,E,
    'echo "[2/6] resources"',
    'aapt2 compile --dir res -o build/res.zip',
    'aapt2 link -o build/base.apk -I "$AJ" --manifest AndroidManifest.xml -A assets --min-sdk-version 24 --target-sdk-version 28 build/res.zip',
    'echo "[3/6] compiling"',
    'ecj -bootclasspath "$AJ" -d build/classes src/MainActivity.java',
    'dx --dex --output=build/classes.dex build/classes',
    '(cd build && zip -q base.apk classes.dex)',
    'echo "[4/6] signing"',
    'KS="$HOME/.apkstudio.jks"',
    '[ -f "$KS" ] || keytool -genkeypair -keystore "$KS" -alias k -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AI Studio"',
    'apksigner sign --ks "$KS" --ks-pass pass:android --out "$W/'+mt.slug+'.apk" build/base.apk',
    'echo "[5/6] copying"',
    'OUT="$W/'+mt.slug+'.apk"',
    'if [ -d "$HOME/storage/downloads" ]; then cp "$OUT" "$HOME/storage/downloads/'+mt.slug+'.apk" && OUT="$HOME/storage/downloads/'+mt.slug+'.apk"; fi',
    'echo "[6/6] done: $OUT"',
    'termux-open "$OUT" || true',''
  ].join('\n');
}
function dlFile(n,t,ty){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([t],{type:ty}));a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
$('#apn').addEventListener('input',()=>{if(S.a.meta)S.a.meta.name=$('#apn').value});
$('#aps').onclick=()=>{const t=mkScript();if(!t)return;dlFile('build-apk.sh',t,'application/octet-stream');$('#apm').textContent='فایل دانلود شد. در ترموکس یک‌بار termux-setup-storage بزن و اجازه بده، بعد «کپی دستور» را بچسبان. بار اول نصب ابزارها چند دقیقه طول می‌کشد. اگر اسم فایل عوض شد، همان اسم را در دستور بنویس.'};
$('#apt').onclick=async()=>{const c='bash ~/storage/downloads/build-apk.sh';try{await navigator.clipboard.writeText(c);$('#apm').textContent='دستور کپی شد: '+c}catch(e){$('#apm').textContent='این دستور را در ترموکس بزن: '+c}};
$('#api').onclick=()=>{const c=$('#ic');if(!S.a.meta)return;c.toBlob(b=>{if(!b)return;const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=S.a.meta.slug+'-icon.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)},'image/png')};
$('#apr').onclick=()=>{const mt=S.a.meta;if(!mt)return;const h1=Math.floor(Math.random()*360);mt.c1='hsl('+h1+',70%,42%)';mt.c2='hsl('+((h1+50)%360)+',80%,55%)';drawIcon()};
/* ناوبری */
function go(n){
  [1,2,3].forEach(i=>{$('#v'+i).hidden=i!==n;document.querySelector('nav [data-v="'+i+'"]').setAttribute('aria-pressed',String(i===n))});
  if(n<3)mode=n===2?'a':'s';
  document.body.style.setProperty('--c',n===2?'#2de2ff':'#00ff84');
  scrollTo({top:0});
}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>go(Number(b.dataset.v)));
</script>
